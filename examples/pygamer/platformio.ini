; Focus on the Adafruit PyGamer
; PlatformIO only; does not work in Arduino IDE (requires custom build flags)
[env:pygamer]
platform = atmelsam
board = adafruit_pygamer_m4
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -frtti
    -fexceptions
    -DDEBUG_REFRESH=0
    -DDEBUG_INPUT=0
    -I../../include/core
    -I../../include/settings
    -I../../include/text
    -I../../include/locale
    -I../../include/views
    -I../../include/controls
    -I../../include/viewcontrollers
; The Adafruit SAMD core bundles Adafruit_TinyUSB_Arduino, whose msc.h uses
; MSC_SUBCLASS_SCSI as an enum member while the core's USBCore.h #defines it
; to 0x06 — a macro/enum collision that fails to compile. We only need the
; classic USB-CDC Serial, so tell the LDF not to compile TinyUSB at all.
lib_ignore = Adafruit TinyUSB Library
lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.0
    adafruit/Adafruit GFX Library@^1.11.0
    adafruit/Adafruit BusIO@^1.14.0
    adafruit/Adafruit Zero DMA Library@^1.1.0
    symlink://../..
monitor_speed = 115200
